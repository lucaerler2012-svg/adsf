name: Build Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository klonen
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Gradle einrichten (Wrapper wird auto-generiert)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          # wrapper-validation wird hier automatisch korrekt gemacht

      - name: Mod bauen
        run: ./gradlew build --no-daemon

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: crystal-auto-${{ github.run_number }}
          path: build/libs/*.jar
          retention-days: 30

      - name: Release erstellen (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
